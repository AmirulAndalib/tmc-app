# Cut a release: build on every desktop platform, then publish one GitHub
# release with checksums.
#
# This is the ONLY path that produces a macOS build. Windows and Linux both
# cross-build from a Linux box (`scripts/build-windows.sh`), and that is the
# fast local loop — but macOS needs the Apple SDK and a real macOS runner.
#
# THE macOS BUILD IS UNSIGNED AND NOT NOTARISED: no APPLE_* secrets are passed
# to `tauri build` below, so Gatekeeper refuses to open it without a
# right-click → Open. Code signing and notarisation arrive when the APPLE_*
# signing secrets are added to the Build step. See docs/BUILDING.md.
name: release

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to build and publish (e.g. v0.2.0)'
                required: true

permissions:
    contents: write
    packages: read

# ONE Rust toolchain for CI and releases, pinned rather than `stable`.
#
# A new stable ships new clippy lints, and `-D warnings` turns each into an
# error — so an unpinned toolchain can fail a release tag on code that passed
# review the day before (1.98's `question_mark` did exactly that). Bumping is a
# one-line change here AND in the other workflow, made on a branch, so the new
# lints fail a pull request first rather than a tag.
env:
    RUST_TOOLCHAIN: '1.98'

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-22.04
                      name: linux
                      args: '--bundles appimage,deb'
                    - os: windows-latest
                      name: windows
                      args: '--bundles nsis,msi'
                    # Both architectures in one binary — an Apple Silicon-only
                    # build is a support ticket from every 2019 MacBook.
                    - os: macos-latest
                      name: macos
                      args: '--target universal-apple-darwin --bundles dmg,app'
        runs-on: ${{ matrix.os }}
        steps:
            # A manual run names the tag to build; without this it would build
            # the default branch and publish the result under that tag.
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            # THE TAG MUST BE THE VERSION THE BINARY REPORTS.
            #
            # `latest.json` takes its version from the tag, but the app reports
            # `tauri.conf.json`'s. A tag pushed without the bump publishes a
            # manifest saying 0.3.0 over a binary that still says 0.1.0: every
            # installed app installs it, still reports 0.1.0, and is offered
            # the same update again forever. Refused here, before any build.
            - name: Tag matches tauri.conf.json
              shell: bash
              env:
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
              run: |
                  conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
                  if [ "${TAG#v}" != "$conf" ]; then
                      echo "::error::Tag $TAG is not the version in src-tauri/tauri.conf.json ($conf). Bump it (and package.json, src-tauri/Cargo.toml), commit, and tag that commit."
                      exit 1
                  fi

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://npm.pkg.github.com
                  scope: '@modcommunity'

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ env.RUST_TOOLCHAIN }}
                  targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Linux build dependencies
              if: matrix.name == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
                    libsoup-3.0-dev libgtk-3-dev libdbus-1-dev \
                    librsvg2-dev libxdo-dev patchelf file

            # `@modcommunity/shared` lives in GitHub Packages. GITHUB_TOKEN can
            # read it when the package grants this repository access; where it
            # does not, PACKAGES_TOKEN is a PAT with `read:packages`.
            - name: Install
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

            # THE SIGNING KEY DECIDES WHETHER THIS RELEASE CAN BE INSTALLED
            # BY THE APP ITSELF.
            #
            # `createUpdaterArtifacts` is off in `tauri.conf.json` and turned on
            # here instead, because with it on and no key `tauri build` fails —
            # which would break `npm run desktop:build` for everybody who does
            # not have one. So it is enabled exactly when the private key is
            # present, and its absence is a warning rather than a failure: a
            # release nobody can auto-update is still a release people can
            # download, and failing the build would mean no release at all.
            #
            # The PUBLIC key is `src-tauri/updater.pub`, compiled in by
            # `build.rs`; the `TMC_UPDATER_PUBKEY` variable overrides it for a
            # fork signing with its own pair. The two halves must match — a
            # mismatch is a release every installed app refuses after the
            # download, so it is checked below before anything is built.
            #
            # TMC_UPDATER_ENDPOINT is the public `latest.json` this workflow
            # uploads to the downloads bucket; compiled in as the updater's
            # default so a release updates from S3 with nothing on the site.
            # Without S3_PUBLIC_URL the app falls back to the site's route.
            - name: Build
              shell: bash
              env:
                  TMC_UPDATER_PUBKEY: ${{ vars.TMC_UPDATER_PUBKEY }}
                  TMC_UPDATER_ENDPOINT: ${{ vars.TMC_UPDATER_ENDPOINT }}
                  S3_PUBLIC_URL: ${{ vars.S3_PUBLIC_URL || secrets.S3_PUBLIC_URL }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  extra=()

                  if [ -z "${TMC_UPDATER_ENDPOINT:-}" ] && [ -n "${S3_PUBLIC_URL:-}" ]; then
                      export TMC_UPDATER_ENDPOINT="${S3_PUBLIC_URL%/}/downloads/tmc-app/latest.json"
                  fi
                  echo "Updater endpoint: ${TMC_UPDATER_ENDPOINT:-(the site's /api/app/v1/update route)}"

                  if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
                      extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
                      echo "Signing updater artifacts."
                  else
                      echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret, so this release is unsigned and download-only: installed apps will show the banner and open the download page rather than installing. See docs/RELEASING.md."
                  fi

                  npx tauri build ${{ matrix.args }} "${extra[@]}"

                  # A signature the compiled-in key cannot verify is caught
                  # here rather than by every user after a download.
                  if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
                      node scripts/verify-updater-signature.mjs src-tauri/target
                  fi

            # WINDOWS ALSO SHIPS THE BARE EXE, AND NO BUNDLER PRODUCES IT.
            #
            # A Tauri app is one file — the webview comes from Windows — so the
            # binary the compile already made runs on its own, and that is what
            # somebody who does not want an installer is handed. README.md has
            # offered it since before this workflow existed; without this step
            # the releases it points at have only the two installers in them.
            #
            # The name is DERIVED from the NSIS output rather than rebuilt out
            # of `tauri.conf.json`, so the product name, the version and the
            # bundler's own spelling of the architecture cannot drift apart —
            # the same reason `publish-release.mjs` is a script with a table in
            # it rather than a glob in this file.
            #
            # `-portable.exe` also keeps it out of that table: the Windows rules
            # match `-setup.exe` and `.msi`, so the updater is never offered a
            # file that installs nothing and registers no `tmc://` scheme.
            - name: Portable exe
              if: matrix.name == 'windows'
              shell: bash
              run: |
                  out=src-tauri/target/release
                  setup="$(ls "$out"/bundle/nsis/*-setup.exe 2>/dev/null | head -1)"

                  if [ -z "$setup" ]; then
                      echo "::error::No NSIS setup under $out/bundle/nsis, so there is nothing to name the portable exe after."
                      exit 1
                  fi

                  # The cargo binary is named after the crate and the file
                  # people are handed is named after the product — the same
                  # rename `build-windows.sh` does on the cross-build path.
                  # The fallback is for the day Tauri starts renaming it
                  # itself, which would otherwise fail the whole release job
                  # over a file that is sitting right there under a new name.
                  exe="$out/tmc-app.exe"
                  [ -f "$exe" ] || exe="$(ls "$out"/*.exe 2>/dev/null | head -1)"

                  if [ -z "$exe" ] || [ ! -f "$exe" ]; then
                      echo "::error::No application exe under $out."
                      exit 1
                  fi

                  mkdir -p "$out/bundle/portable"
                  cp "$exe" "$out/bundle/portable/$(basename "${setup%-setup.exe}")-portable.exe"
                  ls -la "$out/bundle/portable"

            # The `.sig` files ride along with the artifacts, and the macOS
            # updater bundle is the `.app.tar.gz` rather than the `.dmg` — a
            # DMG is a disk image a person mounts, not something an updater can
            # unpack over a running app.
            #
            # They are published on the release so `publish-app-release.ts`
            # can be pointed at one with `--sig-file`. A signature is not a
            # secret: it proves who built the artifact, and it is useless
            # without the artifact it signs.
            - name: Collect
              shell: bash
              run: |
                  mkdir -p out
                  find src-tauri/target -type f \
                    \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                       -o -name '*-setup.exe' -o -name '*-portable.exe' \
                       -o -name '*.msi' -o -name '*.dmg' \
                       -o -name '*.app.tar.gz' -o -name '*.sig' \) \
                    -exec cp {} out/ \;
                  ls -la out

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.name }}
                  path: out/*
                  if-no-files-found: error

    publish:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            # Pinned rather than relying on the runner image's default, since
            # `publish-release.mjs` uses `fetch` and top-level `await`.
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            # checksums.txt is not decoration: `scripts/install.sh` REFUSES to
            # install without it, so a release published without this step is a
            # release the one-line installer will not touch.
            #
            # The `.sig` files are excluded from it. They are not things anybody
            # installs, and a checksum of a signature is a hash of a hash.
            - name: Checksums
              working-directory: artifacts
              run: |
                  sha256sum $(ls | grep -v '\.sig$') > checksums.txt
                  cat checksums.txt

            # THE DOWNLOADS BUCKET: every file of the release under its
            # version, then the updater manifests LAST.
            #
            # The bucket is website-city's uploads bucket (`S3_*` there), and
            # the secrets carry the same names so one set of values serves
            # both. `downloads/tmc-app/<version>/` holds the installers, their
            # `.sig` files, checksums.txt and that version's latest.json;
            # `downloads/tmc-app/latest.json` (stable) and `latest-beta.json`
            # are the switches the app's updater reads, so they are written
            # only after everything they point at exists. A pre-release tag
            # (`v1.2.0-beta.1`) moves only the beta switch.
            #
            # Skipped, loudly, without the bucket secrets: the GitHub release
            # below still happens, and the app then learns about updates from
            # the site's route instead.
            - name: Upload to the downloads bucket
              id: s3
              shell: bash
              env:
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
                  S3_BUCKET: ${{ secrets.S3_BUCKET }}
                  S3_REGION: ${{ secrets.S3_REGION }}
                  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
                  S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE || secrets.S3_FORCE_PATH_STYLE }}
                  S3_PUBLIC_URL: ${{ vars.S3_PUBLIC_URL || secrets.S3_PUBLIC_URL }}
                  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_ACCESS_SECRET }}
                  # Newer AWS CLIs send checksum headers several
                  # S3-compatible stores (R2, B2, MinIO builds) reject.
                  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
                  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
              run: |
                  if [ -z "${S3_BUCKET:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${S3_PUBLIC_URL:-}" ]; then
                      echo "::warning::The downloads bucket is not configured (S3_BUCKET, S3_ACCESS_KEY, S3_ACCESS_SECRET secrets and S3_PUBLIC_URL), so nothing was uploaded to it. See docs/RELEASING.md."
                      exit 0
                  fi

                  version="${TAG#v}"
                  prefix="downloads/tmc-app"
                  base="${S3_PUBLIC_URL%/}/${prefix}/${version}"
                  export AWS_DEFAULT_REGION="${S3_REGION:-us-east-1}"

                  s3=(aws s3)
                  if [ -n "${S3_ENDPOINT:-}" ]; then s3+=(--endpoint-url "$S3_ENDPOINT"); fi
                  if [ "${S3_FORCE_PATH_STYLE:-}" = "true" ] || [ "${S3_FORCE_PATH_STYLE:-}" = "1" ]; then
                      aws configure set default.s3.addressing_style path
                  fi

                  manifest=""
                  if ls artifacts/*.sig >/dev/null 2>&1; then
                      node scripts/updater-manifest.mjs --dir artifacts --version "$version" \
                          --base-url "$base" --out latest.json
                      cp latest.json artifacts/latest.json
                      manifest=latest.json
                  else
                      echo "::warning::This release is unsigned, so no updater manifest was written."
                  fi

                  # Versioned files never change once published.
                  "${s3[@]}" cp artifacts/ "s3://${S3_BUCKET}/${prefix}/${version}/" --recursive \
                      --cache-control "public, max-age=31536000, immutable"

                  if [ -n "$manifest" ]; then
                      for channel in beta stable; do
                          if [ "$channel" = stable ] && [[ "$version" == *-* ]]; then
                              echo "Pre-release: leaving the stable manifest alone."
                              continue
                          fi
                          name=latest.json
                          [ "$channel" = beta ] && name=latest-beta.json
                          "${s3[@]}" cp "$manifest" "s3://${S3_BUCKET}/${prefix}/${name}" \
                              --content-type application/json --cache-control "no-cache, max-age=0"
                          echo "Updated ${S3_PUBLIC_URL%/}/${prefix}/${name}"
                      done
                  fi

                  echo "base-url=$base" >> "$GITHUB_OUTPUT"

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
              run: |
                  prerelease=()
                  case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
                  gh release create "$TAG" --title "TMC $TAG" --generate-notes --draft=false "${prerelease[@]}" \
                    || echo "release already exists, uploading into it"
                  gh release upload "$TAG" artifacts/* --clobber

            # PUBLISHING THE RELEASE TO THE SITE IS PART OF CUTTING IT.
            #
            # Without this, every release ended with somebody running a script
            # once per platform and then remembering to promote — three chances
            # to get it wrong on the one workflow where getting it wrong means
            # telling users about an update and handing them a 404.
            #
            # It runs AFTER the GitHub release exists, because the URLs it
            # publishes are that release's download URLs: sending them first
            # would name files nothing serves yet. One request carries every
            # platform and the promotion together, so the site writes them in
            # one transaction or writes none.
            #
            # It is skipped, loudly, when the secret is unset. A release that
            # was cut and not announced is a state somebody can fix in a minute;
            # a failed release job is one that has to be re-run against a tag
            # that already has artifacts on it.
            - name: Publish to TMC
              shell: bash
              env:
                  TMC_RELEASE_TOKEN: ${{ secrets.TMC_RELEASE_TOKEN }}
                  TMC_SITE_URL: ${{ vars.TMC_SITE_URL }}
                  S3_BASE_URL: ${{ steps.s3.outputs.base-url }}
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
              run: |
                  if [ -z "${TMC_RELEASE_TOKEN:-}" ]; then
                      echo "::warning::TMC_RELEASE_TOKEN is not set, so this release was not published to the site. Nobody is offered it until it is — run scripts/publish-release.mjs by hand, or set the secret and re-run this job."
                      exit 0
                  fi

                  if ! ls artifacts/*.sig >/dev/null 2>&1; then
                      echo "::warning::This release is unsigned, so the app cannot install it. Not publishing to the site — the version banner will still offer the download page."
                      exit 0
                  fi

                  # An ARRAY, not `${VAR:+--site "$VAR"}`. That expansion
                  # word-splits without re-interpreting the quotes, so the URL
                  # would arrive with literal quote characters around it.
                  # Unset means the production site, which is what the script
                  # defaults to. The variable exists so a fork or a staging
                  # deployment can point its own releases somewhere else.
                  site=()

                  if [ -n "${TMC_SITE_URL:-}" ]; then
                      site=(--site "$TMC_SITE_URL")
                  fi

                  # The bucket's copy when there is one — it is where the
                  # static manifest points too — else the GitHub release.
                  base="${S3_BASE_URL:-https://github.com/${{ github.repository }}/releases/download/${TAG}}"

                  node scripts/publish-release.mjs \
                      --dir artifacts \
                      --version "${TAG#v}" \
                      --base-url "$base" \
                      "${site[@]}" \
                      --promote
